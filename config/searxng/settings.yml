# Minimal SearXNG config for the research agent: defaults plus the JSON API.
use_default_settings: true

server:
  # Overridden by the SEARXNG_SECRET environment variable.
  secret_key: "overridden-by-env"
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json
