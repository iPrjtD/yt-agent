# Main agent configuration. Secrets live in .env, everything else here.

channel:
  name: "Buzzbee"
  tagline: "All the buzz, explained."
  handle: "@buzzbee-0"
  # The channel the agent manages; login is rejected if it signs into a different one.
  youtube_channel_id: UCzODU-zkEJBaUqBcUwBzoig
  language: en          # en | hi | bn ... (drives TTS voice and script language)
  geo: IN               # ISO country code for trend sources
  # One promise across all topics: every video explains the WHY behind something people care about.
  # Pillars (target mix): trending explained 40%, evergreen curiosity 40%, real story behind 20%.
  niches:
    - "trending explained: why a movie, show, celebrity moment, viral video, cricket/sports moment, tech launch or business story is everywhere right now"
    - "evergreen curiosity: psychology, money and personal finance, science, AI and technology, everyday 'why does this happen' questions"
    - "the real story behind famous brands, movies, songs, inventions and internet moments"
  # Never make content about these, regardless of score.
  blocked_topics:
    - graphic violence or tragedies involving victims
    - elections and political campaigning
    - medical treatment advice
    - gambling and betting

# Model roles. Any LiteLLM model string works, e.g. "anthropic/claude-sonnet-5-5" after upgrading.
llm:
  fast: ollama_chat/qwen3.5:4b       # classification, scoring, short JSON tasks
  writer: ollama_chat/qwen3.5:9b     # research briefs and scripts
  embed: ollama/bge-m3               # multilingual embeddings (1024 dims)
  embed_dims: 1024
  timeout_s: 600

trends:
  sources:
    google_trends:
      enabled: true
    google_news:
      enabled: true
    wikipedia:
      enabled: true
      project: en.wikipedia
      top_n: 50
    hackernews:
      enabled: true
      min_points: 150
    youtube_trending:
      enabled: true      # skipped automatically when YOUTUBE_API_KEY is empty
      max_results: 50
    rss:
      enabled: true
      feeds:
        - https://www.reddit.com/r/popular/top/.rss?t=day
  # Weights for the heuristic part of the topic score (0-100 scale overall).
  scoring:
    w_traffic: 0.30
    w_corroboration: 0.25
    w_freshness: 0.15
    w_llm_fit: 0.30
    freshness_half_life_h: 18
  keep_days: 14

voice:
  engine: kokoro                 # kokoro (free, local) | elevenlabs (later)
  voice: af_heart                # Kokoro voice id; samples in data/tts_test
  speed: 1.08
  line_gap_s: 0.16

captions:
  whisper_model: base.en         # word timing for burned-in captions

video:
  width: 1080
  height: 1920
  fps: 30
  max_short_seconds: 59

publishing:
  # manual: render + publish package for upload in Studio (until the YouTube API audit passes)
  # api: private upload to "Pending review", then the agent publishes what you approve
  mode: manual
  contains_synthetic_media: false  # true only for realistic AI visuals or voice imitating real people

paths:
  data_dir: data
