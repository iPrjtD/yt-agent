# Main agent configuration. Secrets live in .env, everything else here.

channel:
  name: "Buzzbee"
  tagline: "All the buzz, explained."
  handle: "@buzzbee-0"
  # The channel the agent manages; login is rejected if it signs into a different one.
  youtube_channel_id: UCzODU-zkEJBaUqBcUwBzoig
  language: en          # en | hi | bn ... (drives TTS voice and script language)
  geo: IN               # ISO country code for trend sources
  # Entertainment + information, any domain. NOT a news channel: evergreen, feel-good, surprising content.
  niches:
    - "amazing facts: science, space, human body, animals, nature, psychology, inventions, records"
    - "funny and weird: funny facts, weird history, strange laws, hilarious animal behaviour, everyday absurdities"
    - "motivation and inspiration: real quotes and life lessons from great people, inspiring thoughts"
    - "incredible true stories: mysteries, comebacks, rise of famous brands and people, behind the scenes"
    - "fun pop culture: movies, cricket and sports trivia, viral internet moments (light, not news)"
    - "money explained: why prices rise, what things really cost, how famous brands make money (no advice)"
    - "world and travel: surprising countries and cities, quirky local rules, regional foods people love,
       natural wonders and geographic beauty, travel destinations"
    - "history: ancient, medieval and modern world history facts, empires, inventions, turning points"
    - "famous people: Nobel laureates, great scientists, leaders, artists and athletes and their real stories"
  # Never make content about these, regardless of score.
  blocked_topics:
    - graphic violence or tragedies involving victims
    - current wars and armed conflicts (history from earlier eras is fine)
    - elections and political campaigning
    - medical treatment advice
    - gambling and betting
    - investment tips, buy/sell calls or price predictions

# Model roles. Any LiteLLM model string works, e.g. "anthropic/claude-sonnet-5-5" after upgrading.
llm:
  # Gemini free tier = 20 requests/day PER MODEL, so high-volume scoring stays local and Gemini writes.
  fast: ollama_chat/qwen3.5:4b       # topic scoring (many calls, background)
  writer: gemini/gemini-3.5-flash    # scripts + fact check (free tier; stable)
  fallbacks:                         # tried in order on rate limits / overload / outage
    fast: []
    # Free-tier Flash models get "503 high demand" at peak times; several versions spread the risk.
    writer: [gemini/gemini-3.6-flash, gemini/gemini-3.8-flash, gemini/gemini-3.7-flash,
             gemini/gemini-3.1-flash-lite, gemini/gemini-3.5-flash-lite, ollama_chat/qwen3.5:9b]
  hosted_timeout_s: 120              # cloud calls; local CPU models use timeout_s
  embed: ollama/bge-m3               # multilingual embeddings (1024 dims)
  embed_dims: 1024
  timeout_s: 600

# Content formats: target share of uploads, narrator voice, music mood (assets/music/<mood>/), writing guide.
# gemini_voice / style: expressive narrator; voice / speed: local Kokoro fallback.
formats:
  facts:      {share: 0.25, voice: af_heart,   speed: 1.08, music: upbeat,    gemini_voice: Puck,
               style: "an energetic, amazed science presenter"}
  funny:      {share: 0.15, voice: am_puck,    speed: 1.10, music: funny,     gemini_voice: Fenrir,
               style: "a hilarious, playful comedian friend"}
  motivation: {share: 0.10, voice: am_michael, speed: 0.95, music: inspiring, gemini_voice: Charon,
               style: "a warm, cinematic documentary storyteller"}
  story:      {share: 0.10, voice: af_bella,   speed: 1.02, music: ambient,   gemini_voice: Enceladus,
               style: "a gripping, suspenseful storyteller"}
  trending:   {share: 0.10, voice: af_heart,   speed: 1.08, music: upbeat,    gemini_voice: Zephyr,
               style: "an upbeat, fun pop-culture host"}
  money:      {share: 0.15, voice: am_michael, speed: 1.05, music: upbeat,    gemini_voice: Charon,
               style: "a sharp, friendly explainer revealing a surprising money secret"}
  world:      {share: 0.15, voice: af_heart,   speed: 1.05, music: inspiring, gemini_voice: Charon,
               style: "a curious, wonder-filled travel storyteller"}

trends:
  sources:
    # Idea sources (evergreen)
    wikipedia_dyk:
      enabled: true      # Wikipedia "Did you know..." facts, refreshed daily, each with a source article
    evergreen:
      enabled: true      # LLM-proposed fact/funny/story ideas, verified later by research
      per_run: 8
      categories: [space, human body, animals, ocean, everyday science, psychology, weird history,
                   inventions, money and brands, food, world records, funny animal behaviour, ancient india,
                   optical illusions and the brain, sports trivia, why prices rise, what things really cost,
                   how famous brands make money, surprising countries, quirky laws around the world,
                   travel destinations, amazing cities and landmarks, regional foods around the world,
                   street food favourites, natural wonders, geographic beauty, ancient history,
                   medieval history, modern world history, empires and rulers, Nobel Prize winners,
                   famous people and their real stories]
    motivation:
      enabled: true      # verified Wikiquote quotes + life lessons
      per_run: 2
      people: ["A. P. J. Abdul Kalam", "Swami Vivekananda", "Albert Einstein", "Thomas A. Edison",
               "Nikola Tesla", "Marie Curie", "Helen Keller", "Walt Disney", "Bruce Lee", "Muhammad Ali",
               "Steve Jobs", "Rabindranath Tagore", "Leonardo da Vinci", "Isaac Newton", "Michael Jordan",
               "Ratan Tata", "Mother Teresa", "Theodore Roosevelt", "Maya Angelou", "Charlie Chaplin",
               "C. V. Raman", "Richard Feynman", "Malala Yousafzai", "Nelson Mandela", "Martin Luther King Jr."]
    # Pop-culture signals (light trending only; hard news is filtered out by scoring)
    google_trends:
      enabled: true
    wikipedia:
      enabled: true
      project: en.wikipedia
      top_n: 50
    youtube_trending:
      enabled: true      # skipped automatically when YOUTUBE_API_KEY is empty
      max_results: 50
    google_news:
      enabled: false     # news is not the channel's style
    hackernews:
      enabled: false
    rss:
      enabled: false
      feeds: []
  # Weights for the heuristic part of the topic score (0-100 scale overall).
  scoring:
    w_traffic: 0.30
    w_corroboration: 0.25
    w_freshness: 0.15
    w_llm_fit: 0.30
    freshness_half_life_h: 18
  keep_days: 14

voice:
  # Buzzbee narrates every video in ONE voice (channel identity); only the emotion changes per line.
  host_voice: Charon             # Buzzbee's voice (chosen 2026-10-25): deep, informative storyteller
  host_style: "a warm, versatile storyteller who matches the mood of every line: calm, sincere and grounded for serious or sad moments, lively and playful for fun facts"
  require_host_voice: true       # postpone a Short rather than switch to a different (Kokoro) voice
  gemini_tts_models: [gemini-3.1-flash-tts-preview, gemini-3.8-flash-tts]
  tts_plain_models: [gemini-3.8-flash-tts]   # read [tags]/directions aloud, so they get the bare script
  engine: kokoro                 # kokoro (free, local) | elevenlabs (later)
  voice: af_heart                # Kokoro voice id; samples in data/tts_test
  speed: 1.08
  line_gap_s: 0.16

captions:
  whisper_model: base.en         # word timing for burned-in captions

video:
  width: 1080
  height: 1920
  fps: 30
  target_seconds: 36         # narration is nudged (max 8% faster) towards this
  max_short_seconds: 90      # QA limit; YouTube Shorts allow up to 3 minutes

publishing:
  # api: each new Short is uploaded privately to "Pending review"; move it to "Approved" (or "Rejected")
  #      in YouTube Studio and the review job (every 10 min) publishes it at the next slot.
  # manual: render + publish.txt only; you upload in Studio yourself.
  mode: api
  contains_synthetic_media: false  # true only for realistic AI visuals or voice imitating real people
  publish_mode: slot               # slot: next free slot below | now: publish as soon as you approve
  slots: ["09:00", "13:00", "17:00", "21:00"]  # local times; India-first audiences, spread through the day
  timezone: Asia/Kolkata
  min_gap_hours: 3                 # never two Shorts closer than this

autopilot:
  ideas_every_hours: 3             # collect + score ideas
  produce_every_hours: 1           # one Short every hour while the PC is on (missed runs are not stacked)
  produce_start: "00:30"           # runs at :30 past, away from ideas (:15) and review (:05)
  keep_video_days: 7              # then delete the local video files of published/rejected Shorts
  cleanup_at: "05:30"
  score_limit: 12                  # topics assessed per ideas run (local model)
  require_gemini_writer: true      # postpone a Short rather than write it with the weaker local model

paths:
  data_dir: data
